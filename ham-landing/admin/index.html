<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAM | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #16161a;
            --primary: #6c5ce7;
            --text: #ffffff;
            --text-dim: #a0a0a8;
            --success: #00b894;
            --danger: #d63031;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
        }

        .header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--panel);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .client-table {
            width: 100%;
            background: var(--panel);
            border-radius: 16px;
            border-collapse: collapse;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .client-table th {
            text-align: left;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-dim);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .client-table td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-active { background: rgba(0, 184, 148, 0.1); color: var(--success); }
        .status-inactive { background: rgba(214, 48, 49, 0.1); color: var(--danger); }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn--activate { background: var(--success); color: white; }
        .btn--deactivate { background: var(--danger); color: white; }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .refresh-btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">HAM <span style="color:var(--primary)">ADMIN</span></div>
        <button class="btn refresh-btn" onclick="fetchClients()">Refresh Data</button>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Clients</div>
                <div id="totalClients" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Bots</div>
                <div id="activeBots" class="stat-value">0</div>
            </div>
        </div>

        <table class="client-table">
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Plan</th>
                    <th>WhatsApp</th>
                    <th>Usage</th>
                    <th>Remaining</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="clientBody">
                <!-- Clients will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchClients() {
            try {
                const response = await fetch('/api/admin/clients');
                const clients = await response.json();
                renderClients(clients);
            } catch (err) {
                console.error('Failed to fetch clients:', err);
            }
        }

        function renderClients(clients) {
            const body = document.getElementById('clientBody');
            body.innerHTML = '';
            
            let activeCount = 0;
            
            clients.forEach(client => {
                const status = client.status || 'active';
                if (status === 'active') activeCount++;
                
                const remaining = client.remainingDays !== undefined ? client.remainingDays : 'N/A';
                const remainingColor = remaining <= 5 ? 'var(--danger)' : 'var(--success)';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="font-weight:600">${client.companyName || 'Unknown'}</div>
                        <div style="font-size:11px; color:var(--text-dim)">${client.apiKey}</div>
                    </td>
                    <td>${client.plan || 'Standard'}</td>
                    <td>${client.whatsapp || 'N/A'}</td>
                    <td>
                        <span style="color:var(--primary); font-weight:600">
                            ${(client.usageMinutes || 0).toFixed(2)} min
                        </span>
                    </td>
                    <td><span style="color:${remainingColor}; font-weight:600">${remaining} days</span></td>
                    <td>
                        <span class="status-badge status-${status}">${status}</span>
                    </td>
                    <td>
                        <div style="display:flex; gap:8px">
                            ${status === 'active' 
                                ? `<button class="btn btn--deactivate" onclick="toggleStatus('${client.apiKey}', 'inactive')">Deactivate</button>`
                                : `<button class="btn btn--activate" onclick="toggleStatus('${client.apiKey}', 'active')">Activate</button>`
                            }
                            <button class="btn btn--delete" onclick="deleteClient('${client.apiKey}')" style="background:rgba(214, 48, 49, 0.1); color:var(--danger); border:1px solid var(--danger); padding:8px 12px">
                                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });
            
            document.getElementById('totalClients').textContent = clients.length;
            document.getElementById('activeBots').textContent = activeCount;
        }

        async function deleteClient(apiKey) {
            if (!confirm(`Are you sure you want to PERMANENTLY DELETE this client? This cannot be undone.`)) return;
            
            try {
                const response = await fetch('/api/admin/delete-client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    fetchClients();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Failed to delete client');
            }
        }

        async function toggleStatus(apiKey, newStatus) {
            if (!confirm(`Are you sure you want to set this client to ${newStatus}?`)) return;
            
            try {
                const response = await fetch('/api/admin/toggle-client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey, status: newStatus })
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    fetchClients();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Failed to update status');
            }
        }

        // Initial load
        fetchClients();
    </script>
</body>
</html>
